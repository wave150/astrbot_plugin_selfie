name: astrbot_plugin_selfie
display_name: 她的一天 · 角色生活自拍
short_desc: 她有真实城市、天气和日程，会出门生活、自拍、写日记、发空间
desc: 这不是一个生图插件，而是让一个原创角色在真实世界里过日子：她住在一座真实城市，有家、有当地天气、有每天的日程和会临时发生的事件，会按时间出门上班、吃饭、换装、睡觉，也会在自己生活的现场举起手机自拍。每张照片都有前因后果——此刻在哪座城市、哪个地点、在做什么、穿什么，全部由她的虚拟日程和真实世界状态推导出来；日程表、日记、相册和 QQ 空间说说也都来自同一条生活线。插件不内置任何城市，首次设定家时自动生成 50 个地点与区县拓扑，素材库支持在网页里增删查改。五页工作台，支持地点追加、事件命名素材库与场景/动作/服装随机池、可关闭的一小时结束场景、独立事件ID、十间固定过夜场景、当地时间天气与实际记录日记；生图测试场景由所选地点决定、可自由搭配日常/事件服装动作（事件动作下拉列出该事件全部动作素材并显示名称，吃饭来源可在 5 套吃饭机位里定点选一套，睡觉来源可定点测三种过夜拍法），相册可翻页、大图可双击放大，生图与AI任务切页或关页后仍在后台继续，日记由模型整理成上午/中午/下午/晚上/今日一句并同步到 LivingMemory 长期记忆；事件当前动作优先、睡觉/吃饭平级，三类动作都通过同一套覆写逻辑顶替默认自拍姿势；事件阶段可手写名称或 AI 总结，日程、日记与照片配文优先使用阶段名称；拍照对话可拟人化：按当前人格和聊天上下文接单（第一句末尾（咔嚓）），图片单独发，接单和配文都按句号分段发送，再由她用自己的语气补一句照片里在干什么。
