name: astrbot_plugin_selfie
display_name: 原创角色自拍
short_desc: 让 AstrBot 里的角色会自拍、会出门生活、会写日记
desc: 单实例单角色自拍与生活模拟；插件不内置任何城市，首次设定家时自动生成 50 个地点与区县拓扑，素材库支持在网页里增删查改。五页工作台，支持地点追加、事件命名素材库与场景/动作/服装随机池、可关闭的一小时结束场景、独立事件ID、十间固定过夜场景、当地时间天气与实际记录日记；生图测试场景由所选地点决定、可自由搭配日常/事件服装动作（事件动作下拉列出该事件全部动作素材并显示名称，吃饭来源可在 5 套吃饭机位里定点选一套），相册可翻页、大图可双击放大，生图与AI任务切页或关页后仍在后台继续，日记由模型整理成上午/中午/下午/晚上/今日一句并同步到 LivingMemory 长期记忆；事件进行中自拍会用当前阶段动作顶替默认自拍姿势，照片配文与日程只写短概括。
version: v1.5.18
author: wave150
