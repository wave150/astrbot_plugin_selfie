name: astrbot_plugin_selfie
display_name: 真实世界生活相机 · ta的一天
short_desc: 我按真实城市的天气和日程过日子，也自拍、写日记、发空间
desc: 我会拍照片，也会过日子。我住在一座真实的城市里，有家、有当地的天气，还有每天的日程和随时冒出来的事：到点出门上班，饿了去吃饭，天冷了换衣服，晚上回家睡觉；在这些生活的现场，我举起手机拍自拍、拍特写，有时候也和你拍一张互动照。照片里我在哪、在做什么、穿着什么，都是从我这一天推出来的；日程表、日记、相册和 QQ 空间说说也一样，都是同一条生活线上长出来的东西。插件不内置任何城市，你第一次替我安家时，它会现场生成 50 个地点和区县拓扑，之后素材库都能在网页里增删查改。**不再自带默认形象**，第一次用请在工作台第一页「参考图」上传、裁剪自己的角色图，再填进主站 / 副站槽位；夜间素颜也在这一页设置（勾「启用素颜」并上传素颜三视图，素颜时间为 22:00 到次日 07:00）；想按气温换冬装就加一条「当日平均气温低于 x℃」的条件参考图。工作台分六页（第一页就是参考图）：可以把地点追加进去，把事件整理成命名素材库，场景、动作、服装各自有随机池；一小时结束的场景能关掉，事件有独立 ID，还有十间固定过夜场景；天气取当地实时值，日记记的是实际发生的事。生图测试的场景由所选地点决定，日常和事件的服装动作能自由搭（事件动作下拉会列出这个事件的全部动作素材并显示名字，吃饭能从 5 套机位里点一套，睡觉能定点试三种过夜拍法）；相册能翻页，大图双击放大；生图和 AI 任务切页、关页都在后台继续；日记由模型整理成上午/中午/下午/晚上/今日一句，同步进 LivingMemory 长期记忆。事件当前动作优先，睡觉和吃饭平级，三类动作走同一套覆写逻辑，顶掉默认的自拍姿势；事件阶段可以手写名称，也可以让 AI 总结，日程、日记和照片配文优先用阶段名。拍照对话可以拟人化：我按当前人格和聊天上下文接单（第一句末尾可以带（咔嚓），不喜欢能关掉），图片单独发，接单和配文都跟着 AstrBot 的分段回复设置一段一段发，最后再补一句照片里我在干什么。
